name: Publish Windows installer
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    # This runner uses the owner's tested runtime locally. Never put game data
    # or private credentials on a shared public runner.
    runs-on: [self-hosted, Windows, X64, tm3-release]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ' }
      - name: Tests
        env:
          PYTHONPATH: network
        run: ./.python/python.exe -m unittest discover -s network -p 'test_*.py'
      - name: Build installer from tested runtime
        shell: pwsh
        run: ./.python/python.exe tools/build_installer.py --runtime runtime --iscc "$env:TM3_ISCC"
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/TM3Online-Setup.exe dist/SHA256SUMS.txt dist/update/* --verify-tag --generate-notes
