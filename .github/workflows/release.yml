name: Publish Windows file updates
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ' }
      - name: Tests
        env:
          PYTHONPATH: network
        run: ./.python/python.exe -m unittest discover -s network -p 'test_*.py'
      - name: Build verified file-update assets
        shell: pwsh
        run: ./.python/python.exe tools/build_installer.py --runtime runtime --stage-only
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $manifest = Get-Content -LiteralPath dist/update/TM3Online-update.json -Raw | ConvertFrom-Json
          $assetNames = @('TM3Online-update.json') + @($manifest.files | ForEach-Object { 'tm3-' + $_.sha256 } | Sort-Object -Unique)
          $releaseAssets = @($assetNames | ForEach-Object { Join-Path (Resolve-Path dist/update).Path $_ })
          gh release create $env:GITHUB_REF_NAME @releaseAssets --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
