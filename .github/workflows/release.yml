name: Publish Windows file updates
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Validate release version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and VERSION differ' }
      - name: Tests
        env:
          PYTHONPATH: network
        run: ./.python/python.exe -m unittest discover -s network -p 'test_*.py'
      - name: Build verified file-update assets
        shell: pwsh
        run: ./.python/python.exe tools/build_installer.py --runtime runtime --stage-only
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseAssets = @(Get-ChildItem -LiteralPath dist/update -File | Select-Object -ExpandProperty FullName)
          gh release create $env:GITHUB_REF_NAME @releaseAssets --verify-tag --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
