name: Source checks
on: [push, pull_request]
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-build.txt
      - name: Protocol and lobby regression
        env:
          PYTHONPATH: network
        run: python -m unittest network.test_system256_peer_cable network.test_lobby_client network.test_release_updater
